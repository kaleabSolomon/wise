name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Three separate pnpm projects, so the cache key has to follow all
          # three lockfiles.
          cache-dependency-path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml
            extension/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Not covered by typecheck: the esbuild viewer bundle and its asset copy.
      - run: pnpm build

      - name: Landing page
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Editor extension
        working-directory: extension
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
